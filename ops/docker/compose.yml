services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-watch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-watch_dev}
      POSTGRES_DB: ${POSTGRES_DB:-watch}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - watch-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-watch} -d ${POSTGRES_DB:-watch}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  watch-postgres:
