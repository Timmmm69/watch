packages:
  - apps/*
  - packages/*
# Security fixes in Prisma's transitive CLI/config dependencies; keep Prisma 7.
overrides:
  '@prisma/config@7.10.0>deepmerge-ts': 8.0.0
  'prisma@7.10.0>mysql2': 3.23.1
allowBuilds:
  '@prisma/engines@7.10.0': true
  esbuild@0.28.2: true
  prisma@7.10.0: true
minimumReleaseAgeExclude:
  - '@next/env@16.3.7'
  - '@next/swc-darwin-arm64@16.3.7'
  - '@next/swc-darwin-x64@16.3.7'
  - '@next/swc-linux-arm64-gnu@16.3.7'
  - '@next/swc-linux-arm64-musl@16.3.7'
  - '@next/swc-linux-x64-gnu@16.3.7'
  - '@next/swc-linux-x64-musl@16.3.7'
  - '@next/swc-win32-arm64-msvc@16.3.7'
  - '@next/swc-win32-x64-msvc@16.3.7'
  - next@16.3.7
